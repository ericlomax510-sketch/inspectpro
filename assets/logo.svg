<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Syne:wght@900&amp;display=swap');</style>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00e676;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- magnifying glass icon -->
  <circle cx="22" cy="22" r="14" fill="none" stroke="url(#accent-grad)" stroke-width="3.5"/>
  <circle cx="22" cy="22" r="8" fill="none" stroke="url(#accent-grad)" stroke-width="2"/>
  <line x1="32" y1="32" x2="44" y2="44" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round"/>
  <!-- checkmark inside lens -->
  <polyline points="16,22 20,27 28,18" fill="none" stroke="url(#accent-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wordmark -->
  <text x="54" y="36" font-family="'Syne','Arial Black',Arial,sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="-1">Inspect</text>
  <text x="162" y="36" font-family="'Syne','Arial Black',Arial,sans-serif" font-weight="900" font-size="26" fill="url(#accent-grad)" letter-spacing="-1">Pro</text>
</svg>
