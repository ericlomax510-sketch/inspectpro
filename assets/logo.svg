<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Magnifying glass body -->
  <circle cx="20" cy="20" r="13" fill="none" stroke="#e8ff47" stroke-width="3.5"/>
  <!-- Lens highlight -->
  <circle cx="16" cy="16" r="4" fill="rgba(232,255,71,0.15)"/>
  <!-- Handle -->
  <line x1="30" y1="30" x2="43" y2="43" stroke="#e8ff47" stroke-width="4" stroke-linecap="round"/>
  <!-- Checkmark inside lens -->
  <polyline points="13,20 18,25 27,14" fill="none" stroke="#e8ff47" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
