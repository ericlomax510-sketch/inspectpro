<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48" role="img" aria-label="InspectPro">
  <defs>
    <linearGradient id="inspectpro-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8ff47;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Shield / magnifying glass icon -->
  <circle cx="24" cy="20" r="10" fill="none" stroke="#e8ff47" stroke-width="2.5"/>
  <line x1="31" y1="27" x2="38" y2="34" stroke="#e8ff47" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="24" cy="20" r="4" fill="url(#inspectpro-grad)" opacity="0.7"/>
  <!-- Wordmark -->
  <text x="46" y="27" font-family="'Syne', 'Arial Black', sans-serif" font-weight="900" font-size="18" letter-spacing="-0.5" fill="#ffffff">Inspect</text>
  <text x="114" y="27" font-family="'Syne', 'Arial Black', sans-serif" font-weight="900" font-size="18" letter-spacing="-0.5" fill="#e8ff47">Pro</text>
</svg>
